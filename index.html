<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thought Chain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&display=swap">
<style>
:root{--thought-font:"Lora",Georgia,"Times New Roman",serif;--bg:#e8f5e9;--line:#1b5e20;--dot:#8d948e;--text:#16301a;--muted:#4f6b53;--card:#f4fbf5;--edge:#c5e0c8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1f14;--line:#6fcf8a;--dot:#9aa39c;--text:#e6f2e8;--muted:#92b097;--card:#16301c;--edge:#27452d}}
:root[data-theme="dark"]{--bg:#0f1f14;--line:#6fcf8a;--dot:#9aa39c;--text:#e6f2e8;--muted:#92b097;--card:#16301c;--edge:#27452d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px}
p.sub{margin:0 0 16px;color:var(--muted);font-size:14px}
textarea{width:100%;height:150px;background:var(--card);color:var(--text);border:1px solid var(--edge);border-radius:8px;padding:10px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
details{margin-bottom:12px}
summary{cursor:pointer;color:var(--muted);font-size:14px;margin-bottom:8px}
.day{margin-top:28px}
.day h3{margin:0;font-size:15px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.chain{position:relative;padding:20px 0 28px}
.chain::before{content:"";position:absolute;left:11px;top:0;bottom:0;width:4px;border-radius:2px;background:var(--line)}
.node{position:relative;padding-left:44px}
.dot{position:absolute;left:0;top:6px;width:26px;height:26px;border-radius:50%;background:var(--dot)}
.node::before{content:"";position:absolute;left:26px;top:18px;width:14px;height:2px;background:var(--line)}
.thought{background:var(--card);border:1px solid var(--edge);border-radius:10px;padding:8px 12px;overflow-wrap:anywhere;font-family:var(--thought-font);font-size:17px;line-height:1.55}
.time{display:block;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>Thought Chain</h1>
<p class="sub">One dot per thought. The line is the day; gaps follow the hours between thoughts.</p>
<details>
<summary>Edit thoughts.md (live preview)</summary>
<textarea id="src" spellcheck="false"></textarea>
</details>
<div id="thought-chain" class="tc"></div>
</main>
<script src="thought-chain.js"></script>
<script>
  const out = document.getElementById("thought-chain");
  const src = document.getElementById("src");

  fetch("thoughts.md")   // later: the raw.githubusercontent.com URL
    .then(r => r.text())
    .then(md => { src.value = md; renderChain(md, out); });

  src.addEventListener("input", () => renderChain(src.value, out));
</script>
</body>
</html>
